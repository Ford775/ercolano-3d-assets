<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Balsamario 3D - Parco Archeologico di Ercolano</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f7f9; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    .btn-ar { background: #00A8B5; color: #fff; border: none; border-radius: 4px; padding: 12px 20px; font-weight: bold; position: absolute; top: 20px; right: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  </style>
</head>
<body>
  <model-viewer 
    src="balsamario-draco.glb" 
    alt="Balsamario Inv. 75863" 
    ar ar-modes="webxr scene-viewer quick-look" 
    camera-controls auto-rotate shadow-intensity="1">
    <button slot="ar-button" class="btn-ar">Visualizza in WebAR</button>
  </model-viewer>
</body>
</html>
