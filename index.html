<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Balsamario Inv. 75863 - Parco Archeologico di Ercolano | WebAR</title>

  <!-- Google model-viewer standard W3C WebXR -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f2f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    /* Scheda descrittiva scientifica */
    .info-card {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 320px;
      z-index: 10;
      border: 1px solid #e2e8f0;
    }
    .info-card h1 {
      font-size: 15px;
      color: #0f172a;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .info-card p {
      font-size: 12px;
      color: #475569;
      line-height: 1.4;
    }
    /* Pulsante di avvio Realtà Aumentata */
    .ar-button {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #00A8B5;
      color: #ffffff;
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 168, 181, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>
<body>

  <div class="info-card">
    <h1>Balsamario (Inv. 75863)</h1>
    <p>Parco Archeologico di Ercolano — Replica 3D ottimizzata con compressione Draco per fruizione WebAR outdoor.</p>
  </div>

  <model-viewer 
    src="balsamario-draco.glb"
    alt="Balsamario Inv. 75863 - Parco Archeologico di Ercolano"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    exposure="1"
    scale="0.05 0.05 0.05"
    ar-scale="fixed">
    
    <button slot="ar-button" class="ar-button">
      Visualizza nello Spazio (WebAR)
    </button>
  </model-viewer>

</body>
</html>
